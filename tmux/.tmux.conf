# === Core options ===
set -g mouse on
set -g escape-time 10            # near-zero delay so Ctrl+B registers instantly
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm*:Tc"   # true color for iTerm2
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on
set-option -g status-position top

# === Bind keys ===
unbind '%'
bind "'" split-window -h

unbind '.'
bind '.' kill-pane

# === TPM plugins ===
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'

# === Catppuccin config (v2) ===
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"

# Status bar layout — v2 requires explicit module wiring via #{E:...}
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}#{E:@catppuccin_status_session}#{E:@catppuccin_status_directory}"

# === TPM bootstrap (keep at bottom) ===
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
